<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Crimson+Pro:wght@400;500;600;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Mise en page : bandeau d'ambiance en haut, carte de combat à gauche (pleine hauteur), image + Discord à droite.
   Vue admin : même ossature, la carte est remplacée par le poste de commande, barre Spotify en bas. */
:root{
  --ink:#0f1318;        /* fond général, encre bleu nuit */
  --panel:#171c23;      /* cadrans */
  --panel-2:#1f262f;    /* champs, éléments surélevés */
  --line:#2b3440;       /* bordures */
  --text:#e7e2d8;       /* texte principal, ivoire froid */
  --muted:#8d97a3;      /* texte secondaire */
  --gold:#d6a24a;       /* accent : or de chandelle */
  --gold-soft:rgba(214,162,74,.14);
  --blurple:#7d86e8;    /* touche Discord */
  --danger:#d9705f;
  --ok:#6fbf8a;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --well:#0b0e12; --code-bg:#11151a; --on-gold:#1a1408; --msg:#d4d0c8;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:15px/1.45 var(--f-body);overflow:hidden}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:10px 12px}

/* ---------- Bandeau ---------- */
.banner{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:52px}
.banner .cell{display:flex;flex-direction:column;justify-content:center;padding:6px 16px;border-right:1px solid var(--line);min-width:0}
.banner .cell:last-child{border-right:0}
.banner .lbl{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.banner .val{font-family:var(--f-display);font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .cell.lieu .val{font-size:20px;color:var(--gold)}
.banner .cell.quest{flex:1;background:linear-gradient(90deg,var(--gold-soft),transparent 70%)}
.banner .cell.quest .val{font-family:var(--f-body);font-size:16px;font-weight:500;letter-spacing:0}
.banner input.val{background:transparent;border:0;border-bottom:1px dashed var(--line);padding:0;width:100%;min-width:90px}
.banner input.val:focus{outline:none;border-bottom-color:var(--gold)}

/* ---------- Grille principale ---------- */
.main{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px;min-height:0}
.col{display:grid;gap:10px;min-height:0}
.col.right{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.pane-h h2{margin:0;font:700 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pane-h .sp{flex:1}
.pane-b{flex:1;min-height:0;position:relative}
.tag{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.tag.ex{color:var(--gold);border-color:rgba(214,162,74,.4)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
a.btn{text-decoration:none;color:var(--text)}

iframe.fill{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--well)}

.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--text);font-size:18px;margin-bottom:6px;letter-spacing:.04em}

/* Image de scène */
.scene{position:absolute;inset:0;display:grid;place-items:center;background:var(--well)}
.scene img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .35s}
.scene .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:var(--f-display);font-size:18px;letter-spacing:.04em}

/* ---------- Discord / Avrae ---------- */
.feed{position:absolute;inset:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:32px 1fr;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body);color:#0f1318}
.msg .who{font-weight:700;font-size:14px}
.msg .who .bot{font:600 9px/1 var(--f-mono);background:var(--blurple);color:#fff;padding:2px 4px;border-radius:3px;margin-left:6px;vertical-align:2px}
.msg .when{color:var(--muted);font-size:11px;margin-left:6px;font-weight:400}
.msg .txt{font-size:14px;color:var(--msg)}
.embed{margin-top:4px;background:var(--panel-2);border-left:4px solid var(--blurple);border-radius:4px;padding:8px 10px;font-size:13px}
.embed .t{font-weight:700;margin-bottom:4px}
.embed .f{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px 12px;margin-top:6px}
.embed .f .k{display:block;font-size:11px;color:var(--muted);font-weight:700}
.embed code{font-family:var(--f-mono);font-size:12px;background:var(--code-bg);padding:1px 4px;border-radius:3px}
.crit{color:var(--ok);font-weight:700}
img.av{object-fit:cover;background:var(--panel-2)}
.txt pre,.embed pre{white-space:pre-wrap;font:12px/1.4 var(--f-mono);background:var(--code-bg);padding:6px 8px;border-radius:4px;margin:4px 0}
.txt code,.embed code{font-family:var(--f-mono);font-size:12px;background:var(--code-bg);padding:1px 4px;border-radius:3px}
.embed{position:relative;overflow-wrap:anywhere}
.embed .f .full{grid-column:1/-1}
.e-au{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.e-de{margin-top:2px}
.e-fo{font-size:11px;color:var(--muted);margin-top:6px}
.e-th{float:right;width:48px;height:48px;object-fit:cover;border-radius:4px;margin:0 0 4px 8px}
.e-im{display:block;max-width:100%;max-height:220px;border-radius:4px;margin-top:6px}
.ment{color:var(--blurple);background:rgba(125,134,232,.15);border-radius:3px;padding:0 2px}
.emo{width:18px;height:18px;vertical-align:-4px}
.quote{display:block;border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.txt a,.embed a{color:var(--blurple)}

/* ---------- Admin ---------- */
.console{grid-template-rows:auto minmax(0,1fr)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:10px 12px;max-height:228px;overflow-y:auto}
.thumb{position:relative;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--well);aspect-ratio:4/3;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:12px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.thumb .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;display:none}
.thumb:hover .x{display:block}
.add{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.add input[type=text]{flex:1;min-width:140px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.settings{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
.settings label{color:var(--muted)}
.settings input{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;width:100%;font-family:var(--f-mono);font-size:12px}


/* Connexion */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--ink)}
.login-card{width:min(360px,100%);display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.login-card h1{margin:0;font:700 22px var(--f-display);letter-spacing:.06em;color:var(--gold)}
.login-card p{margin:0 0 8px;color:var(--muted);font-size:14px}
.login-card label{font-size:13px;color:var(--muted)}
.login-card input{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.login-card .btn{margin-top:8px;padding:9px}
.login-err{color:var(--danger)!important;margin:4px 0 0!important}
.code-hint{align-self:center;font-size:12px;color:var(--muted)}
.tag.sync.ok{color:var(--ok);border-color:rgba(111,191,138,.4)}
.tag.sync.err{color:var(--danger);border-color:rgba(217,112,95,.5)}
/* Fenêtre de réglages */
.col.left{position:relative}
.pop{position:absolute;top:46px;right:12px;width:min(620px,calc(100% - 24px));z-index:20;background:var(--panel);
  border:1px solid var(--gold);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pop .settings{border-top:0;padding:14px}
.pop-foot{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.reader iframe.fill{background:#fff}
/* Salon Discord */
.dc-row{display:grid;grid-template-columns:1fr 150px;gap:6px}
.settings input.dc-label{font-family:var(--f-body);font-size:13px}
/* Carte & notes partagées */
.split{display:grid;grid-template-columns:1fr 1fr}
.split .half{position:relative;min-width:0}
.split .half + .half{border-left:1px solid var(--line)}
.split[data-mode="map"]{grid-template-columns:1fr}
.split[data-mode="map"] #notes,.split[data-mode="notes"] #miniMap{display:none}
.split[data-mode="notes"]{grid-template-columns:1fr}
.split[data-mode="notes"] .half{border-left:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:4px 10px;font-size:12px;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--gold-soft);color:var(--gold)}
.settings input.cap-in{font-family:var(--f-body);font-size:14px}
.settings input:disabled{opacity:.5}

/* ---------- Spotify ---------- */
.music{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:8px 14px}
.music .ctl{display:flex;gap:6px}
.music .ctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
.music .ctl button.play{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.music .now{min-width:0}
.music .now .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .now .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music select{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;max-width:220px}
.tracks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tracks button{flex:none;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.tracks button.on{border-color:var(--gold);color:var(--gold)}
.vol{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.vol input{width:90px;accent-color:var(--gold)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}


/* ---------- Carte de combat ---------- */
.bm{position:absolute;inset:0;overflow:hidden;background:var(--well);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bm[data-tool="ruler"]{cursor:crosshair}
.bm-world{position:absolute;left:0;top:0;transform-origin:0 0}
.bm-img{display:block;width:100%;height:100%;max-width:none;pointer-events:none}
.bm-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right, rgba(0,0,0,.45) var(--gw,1px), transparent var(--gw,1px)),linear-gradient(to bottom, rgba(0,0,0,.45) var(--gw,1px), transparent var(--gw,1px))}
.bm.far .tok-n{display:none}
.bm.far .tok:hover .tok-n,.bm.far .tok.sel .tok-n{display:block}
.bm-ruler{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bm-tokens{position:absolute;inset:0}
.tok{position:absolute;pointer-events:auto;display:grid;place-items:center}
.tok.mov{cursor:grab}
.tok.drag{cursor:grabbing;z-index:5;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.tok-c{width:88%;height:88%;border-radius:50%;background:var(--tc);border:calc(3px * var(--inv,1)) solid #f3ead8;
  box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden;color:#fff;
  font:700 calc(18px * var(--inv,1)) var(--f-body);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tok-c img{width:100%;height:100%;object-fit:cover}
.t-ennemi .tok-c{border-color:#e9a091}
.t-pnj .tok-c{border-color:#ecd38f}
.tok.me .tok-c{box-shadow:0 0 0 calc(3px * var(--inv,1)) var(--gold),0 2px 6px rgba(0,0,0,.6)}
.tok.sel .tok-c{box-shadow:0 0 0 calc(4px * var(--inv,1)) var(--gold),0 2px 10px rgba(0,0,0,.6)}
.tok.hid{opacity:.45}.tok.hid .tok-c{border-style:dashed}
.tok-n{position:absolute;left:50%;top:100%;transform:translate(-50%,-30%);white-space:nowrap;pointer-events:none;
  font:600 calc(12px * var(--inv,1)) var(--f-body);color:#fff;background:rgba(0,0,0,.65);padding:calc(1px * var(--inv,1)) calc(6px * var(--inv,1));border-radius:calc(4px * var(--inv,1))}
.bm-tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.bm-tools button{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--muted)}
.bm-tools button:hover{color:var(--text);background:var(--panel-2)}
.bm-tools button.on{background:var(--gold-soft);color:var(--gold)}
.bm-sep{height:1px;background:var(--line);margin:2px 4px}
.bm-measure{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--gold);color:var(--text);border-radius:6px;padding:3px 8px;font:600 13px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.bm-panel{position:absolute;top:10px;right:10px;width:min(280px,calc(100% - 70px));max-height:calc(100% - 20px);overflow-y:auto;z-index:10;
  background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.5);padding:10px 12px;display:grid;gap:6px;font-size:13px;cursor:default}
.bm-panel label{color:var(--muted);display:flex;justify-content:space-between}
.bm-panel input:not([type=checkbox]):not([type=range]):not([type=color]),.bm-panel select{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%;min-width:0}
.bm-panel input[type=range]{accent-color:var(--gold);width:100%}
.bm-panel input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:2px}
.bm-panel .bm-check{color:var(--text);justify-content:flex-start;gap:8px;align-items:center}
.bm-panel .seg{justify-self:start}
.bm-ph{position:sticky;top:-10px;z-index:1;background:var(--panel);margin:-10px -12px 0;padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;font-family:var(--f-display);letter-spacing:.06em}
.bm-x{border:0;background:transparent;color:var(--muted);font-size:14px}
.bm-row{display:flex;gap:6px}
.bm-hint{margin:0;color:var(--muted);font-size:12px}
.bm-del{color:var(--danger);margin-top:4px}
.bm-panel output{color:var(--text);font-variant-numeric:tabular-nums}
.who-list{display:grid;gap:8px}
.bm-lib{width:min(320px,calc(100% - 70px))}
.lib-g{display:grid;gap:6px}
.lib-gt{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.lib-it{position:relative}
.lib-place{width:100%;display:grid;justify-items:center;gap:4px;padding:8px 4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.lib-place:hover{border-color:var(--gold)}
.lib-c{width:38px;height:38px;border-radius:50%;background:var(--tc);border:2px solid #f3ead8;display:grid;place-items:center;overflow:hidden;color:#fff;font:700 13px var(--f-body);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.lib-c img{width:100%;height:100%;object-fit:cover}
.lib-c.big{width:84px;height:84px;font-size:26px;border-width:3px}
.lib-n{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-ed{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--panel);color:var(--muted);font-size:12px;opacity:0}
.lib-it:hover .lib-ed,.lib-ed:focus-visible{opacity:1}
.lib-prev{display:grid;place-items:center;padding:6px 0}
.lib-gt{display:flex;align-items:center;justify-content:space-between}
.lib-add{border:0;background:transparent;color:var(--gold);font:600 12px var(--f-body);letter-spacing:0;text-transform:none;padding:2px 4px}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--c);padding:0}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--gold-soft)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.modal-card{width:min(360px,100%);display:grid;gap:10px;background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);padding:22px;text-align:center}
.modal-card h2{margin:0;font:700 20px var(--f-display);color:var(--gold);letter-spacing:.04em}
.modal-card p{margin:0;color:var(--muted);font-size:14px}
.modal-card .btn{padding:9px;text-align:center}
.btn.who{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:15px;text-align:left}
.btn.who .dot{width:14px;height:14px;border-radius:50%;flex:none}

/* ================= Thème Parchemin =================
   Vélin vieilli, encre sépia, accent cire rouge, filets dorés doubles. */
:root[data-skin="parchemin"]{
  --ink:#d9c6a0; --panel:#f1e4c6; --panel-2:#e7d5ae; --line:#a88a58;
  --text:#2c1d0e; --muted:#6f5634; --gold:#8e2b1d; --gold-soft:rgba(142,43,29,.12);
  --blurple:#4f5a8f; --well:#2a1f14; --code-bg:#dccaa0; --on-gold:#f6ead0; --msg:#3a2a18;
  --f-display:"IM Fell English SC", "Cinzel", Georgia, serif;
  --f-body:"Crimson Pro", "Iowan Old Style", Georgia, serif;
  --r:4px; color-scheme:light;
}
[data-skin="parchemin"] body{
  font-size:16px;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(90,55,20,.35) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
/* ============ État partagé ============ */
const KEY = 'table-mj-state-v1';
const isAdmin = location.hash.replace('#','') === 'admin';

function svgScene(title, a, b, motif){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'>
  <defs><radialGradient id='g' cx='50%' cy='40%' r='75%'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></radialGradient></defs>

  <text x='400' y='560' text-anchor='middle' font-family='Georgia' font-size='20' fill='rgba(255,255,255,.45)' letter-spacing='4'>SAMPLE IMAGE</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const SAMPLE_IMAGES = [
  {id:'ex1', name:'The Black Boar Tavern', src:svgScene('', '#7a4a22', '#1a0f08',
    "<rect x='120' y='300' width='560' height='22' fill='#3a2412'/><circle cx='400' cy='170' r='60' fill='#f2b24d' opacity='.55'/><circle cx='400' cy='170' r='26' fill='#ffd78a'/>")},
  {id:'ex2', name:'Gloommist Forest', src:svgScene('', '#2f4a3a', '#0b1410',
    "<polygon points='150,520 220,220 290,520' fill='#14261c'/><polygon points='330,520 420,160 510,520' fill='#0f1f16'/><polygon points='540,520 610,250 680,520' fill='#14261c'/><rect y='420' width='800' height='120' fill='#cfd8d0' opacity='.12'/>")},
  {id:'ex3', name:'Master Aldric, alchemist', src:svgScene('', '#3b3560', '#100e1c',
    "<circle cx='400' cy='230' r='80' fill='#1c1930'/><path d='M260 520 Q400 300 540 520Z' fill='#1c1930'/><circle cx='520' cy='380' r='22' fill='#6fe0b0' opacity='.7'/>")},
  {id:'ex4', name:'Ruins of Kar-Dûn', src:svgScene('', '#5a5a6a', '#121218',
    "<rect x='180' y='240' width='50' height='280' fill='#22222c'/><rect x='300' y='300' width='50' height='220' fill='#22222c'/><rect x='560' y='200' width='50' height='320' fill='#22222c'/><rect x='160' y='220' width='200' height='26' fill='#22222c'/>")}
];

/* ============ Carte de combat ============
   Monde = pixels de l'image de la carte. Les jetons sont stockés en coordonnées monde (coin haut-gauche).
   Vue (zoom/position) propre à chaque écran, jamais synchronisée. */
const ICONS = {
  move:  '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>',
  ruler: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="8" rx="1.5" transform="rotate(-30 12 12)"/><path d="M7.5 9.6l1.2 2M10.6 7.8l1.7 2.9M13.7 6l1.2 2"/></svg>',
  fit:   '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  add:   '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  map:   '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>'
};

function sampleMap(){
  const W = 1400, H = 980;
  const room = (x,y,w,h) => `<rect x='${x}' y='${y}' width='${w}' height='${h}' fill='#8a7f6c' stroke='#3b342a' stroke-width='10'/>`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}' viewBox='0 0 ${W} ${H}'>
    <rect width='${W}' height='${H}' fill='#2a2620'/>
    ${room(140,140,420,350)}${room(700,70,560,420)}${room(280,630,840,280)}
    <rect x='560' y='280' width='140' height='70' fill='#8a7f6c'/><rect x='350' y='490' width='70' height='140' fill='#8a7f6c'/><rect x='980' y='490' width='70' height='140' fill='#8a7f6c'/>
    <circle cx='980' cy='280' r='45' fill='#3a6b8a' opacity='.85'/>
    <rect x='770' y='140' width='70' height='70' fill='#5a4a35'/><rect x='420' y='700' width='140' height='70' fill='#5a4a35'/>
    <text x='${W/2}' y='${H-20}' text-anchor='middle' font-family='Georgia' font-size='22' fill='rgba(255,255,255,.35)' letter-spacing='4'>SAMPLE MAP</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const DEFAULT_CARTE = {
  src: sampleMap(), path: null, w: 1400, h: 980,
  cell: 70, offX: 0, offY: 0, grid: true,
  jetons: [
    {id:'j1', nom:'Kaelen', type:'pj',     couleur:'#5b8fd6', img:'', taille:1, x:210, y:210, visible:true},
    {id:'j2', nom:'Mira',   type:'pj',     couleur:'#c76fa8', img:'', taille:1, x:280, y:280, visible:true},
    {id:'j3', nom:'Thorin', type:'pj',     couleur:'#d69a4a', img:'', taille:1, x:210, y:350, visible:true},
    {id:'j4', nom:'Goblin', type:'ennemi', couleur:'#b84a3c', img:'', taille:1, x:910, y:210, visible:true},
    {id:'j5', nom:'Ogre',   type:'ennemi', couleur:'#7a3a2c', img:'', taille:2, x:1050, y:280, visible:false}
  ]
};
const PLAYER_COLORS = ['#5b8fd6','#c76fa8','#d69a4a','#4fa37a','#8a6fd1','#d0584a','#3fa3b5','#a8a24a'];
const TYPE_LABEL = {pj:'Player', ennemi:'Enemy', pnj:'NPC'};

const MAP_VIEWS = {};
let currentMap = null;

function initials(n){
  const t = (n||'?').trim(), num = t.match(/\s(\d+)$/);
  return (t[0] || '?').toUpperCase() + (num ? num[1] : '');   // « Mira » → M, « Goblin 2 » → G2
}
/* Fiche joueur (couleur, image) : c'est elle qui habille le jeton du joueur sur la carte */
function rosterOf(nom){ return (state.joueurs || []).find(j => j.nom === nom); }
function faceOf(t){
  if(t.type === 'pj'){ const r = rosterOf(t.nom); if(r) return {couleur:r.couleur, img:r.img || ''}; }
  return {couleur:t.couleur, img:t.img || ''};
}
function snap(v, off, cell){ return off + Math.round((v - off) / cell) * cell; }

function mountMap(host, key, opts){
  const editable = !!opts.editable;
  host.innerHTML = `
    <div class="bm" data-tool="move">
      <div class="bm-world"><img class="bm-img" alt="" draggable="false"><div class="bm-grid"></div><div class="bm-tokens"></div><svg class="bm-ruler" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="bm-tools" role="toolbar" aria-label="Map tools">
        <button data-tool="move" class="on" title="Move (map and tokens)" aria-label="Move">${ICONS.move}</button>
        <button data-tool="ruler" title="Ruler: drag to measure" aria-label="Ruler">${ICONS.ruler}</button>
        <button data-act="fit" title="Fit map to screen" aria-label="Fit to screen">${ICONS.fit}</button>
        ${editable ? `<span class="bm-sep"></span>
        <button data-act="add" title="Token library" aria-label="Token library">${ICONS.add}</button>
        <button data-act="cfg" title="Map image and grid" aria-label="Map settings">${ICONS.map}</button>` : ''}
      </div>
      <div class="bm-measure" hidden></div>
      <div class="bm-panel" data-panel="cfg" hidden></div>
      <div class="bm-panel" data-panel="tok" hidden></div>
      <div class="bm-panel bm-lib" data-panel="lib" hidden></div>
    </div>`;
  const root = host.querySelector('.bm'), world = root.querySelector('.bm-world'),
        img = root.querySelector('.bm-img'), grid = root.querySelector('.bm-grid'),
        layer = root.querySelector('.bm-tokens'), ruler = root.querySelector('.bm-ruler'),
        measure = root.querySelector('.bm-measure'),
        pCfg = root.querySelector('[data-panel=cfg]'), pTok = root.querySelector('[data-panel=tok]'), pLib = root.querySelector('[data-panel=lib]');
  let view = MAP_VIEWS[key] || null, tool = 'move', dragging = null, selected = null, loadedSrc = null;
  const C = () => state.carte;

  function apply(){
    if(!view) return;
    world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; MAP_VIEWS[key] = view;
    root.style.setProperty('--inv', 1/view.s);
    root.style.setProperty('--gw', Math.max(1, 1/view.s) + 'px');          // trait du quadrillage toujours visible
    root.classList.toggle('far', C().cell * view.s < 34);                   // noms masqués quand les jetons sont minuscules
  }
  function fit(){
    const r = root.getBoundingClientRect(), c = C();
    if(!r.width || !c.w) return;
    const s = Math.min(r.width / c.w, r.height / c.h) * 0.96;
    view = {s, x:(r.width - c.w*s)/2, y:(r.height - c.h*s)/2}; apply();
  }
  function toWorld(cx, cy){ const r = root.getBoundingClientRect(); return {x:(cx - r.left - view.x)/view.s, y:(cy - r.top - view.y)/view.s}; }

  function canMove(t){ return editable || (t.type === 'pj' && t.nom === opts.me); }

  function renderGrid(){
    const c = C();
    world.style.width = c.w + 'px'; world.style.height = c.h + 'px';
    grid.hidden = !c.grid;
    grid.style.backgroundSize = `${c.cell}px ${c.cell}px`;
    grid.style.backgroundPosition = `${c.offX}px ${c.offY}px`;
    ruler.setAttribute('viewBox', `0 0 ${c.w} ${c.h}`); ruler.setAttribute('width', c.w); ruler.setAttribute('height', c.h);
  }
  function renderTokens(){
    const c = C();
    const list = c.jetons.filter(t => editable || t.visible !== false);
    const keep = new Set(list.map(t => t.id));
    layer.querySelectorAll('.tok').forEach(el => { if(!keep.has(el.dataset.id)) el.remove(); });
    list.forEach(t => {
      let el = layer.querySelector(`.tok[data-id="${CSS.escape(t.id)}"]`);
      if(!el){ el = document.createElement('div'); el.className = 'tok'; el.dataset.id = t.id; layer.appendChild(el); }
      if(dragging && dragging.id === t.id) return;           // ne pas contrarier le glisser en cours
      const size = c.cell * (t.taille || 1);
      const f = faceOf(t);
      el.style.cssText = `left:${t.x}px;top:${t.y}px;width:${size}px;height:${size}px;--tc:${f.couleur || '#888'}`;
      el.className = `tok t-${t.type}${t.visible === false ? ' hid' : ''}${canMove(t) ? ' mov' : ''}${selected === t.id ? ' sel' : ''}${t.type==='pj' && t.nom===opts.me ? ' me' : ''}`;
      el.innerHTML = `<div class="tok-c">${f.img ? `<img src="${esc(f.img)}" alt="" draggable="false">` : `<span>${esc(initials(t.nom))}</span>`}</div><div class="tok-n">${esc(t.nom)}</div>`;
    });
  }
  function render(){
    const c = C();
    if(loadedSrc !== c.src){
      loadedSrc = c.src;
      img.onload = () => {
        const nw = img.naturalWidth || c.w, nh = img.naturalHeight || c.h;
        if(editable && (nw !== c.w || nh !== c.h)){ c.w = nw; c.h = nh; save(); }
        renderGrid(); if(!view) fit();
      };
      img.src = c.src;
    }
    renderGrid(); renderTokens();
    if(!view) requestAnimationFrame(fit); else apply();
  }

  /* ---- Pointeur : glisser jeton, panoramique, règle, pincement ---- */
  const pts = new Map(); let pan = null, pinch = null, rulerStart = null, lastLive = 0;
  root.addEventListener('pointerdown', e => {
    if(e.target.closest('.bm-tools,.bm-panel')) return;
    root.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 2){ // pincement
      const [a,b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), s: view.s, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
      dragging = null; pan = null; rulerStart = null; return;
    }
    const tokEl = e.target.closest('.tok');
    if(tool === 'ruler'){
      const w = toWorld(e.clientX, e.clientY), c = C();
      rulerStart = {x: snap(w.x - c.cell/2, c.offX, c.cell) + c.cell/2, y: snap(w.y - c.cell/2, c.offY, c.cell) + c.cell/2};
      return;
    }
    if(tokEl){
      const t = C().jetons.find(j => j.id === tokEl.dataset.id);
      if(t && canMove(t)){
        const w = toWorld(e.clientX, e.clientY);
        dragging = {id:t.id, el:tokEl, dx:w.x - t.x, dy:w.y - t.y, sx:e.clientX, sy:e.clientY, moved:false};
        tokEl.classList.add('drag'); return;
      }
    }
    pan = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false};
  });
  root.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size === 2){
      const [a,b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
      zoomAt(pinch.cx, pinch.cy, (pinch.s * d / pinch.d) / view.s); return;
    }
    if(rulerStart){
      const w = toWorld(e.clientX, e.clientY), c = C();
      const end = {x: snap(w.x - c.cell/2, c.offX, c.cell) + c.cell/2, y: snap(w.y - c.cell/2, c.offY, c.cell) + c.cell/2};
      const n = Math.max(Math.abs(end.x - rulerStart.x), Math.abs(end.y - rulerStart.y)) / c.cell;
      const sw = 4 / view.s;
      ruler.innerHTML = `<line x1="${rulerStart.x}" y1="${rulerStart.y}" x2="${end.x}" y2="${end.y}" stroke="var(--gold)" stroke-width="${sw}" stroke-dasharray="${sw*3} ${sw*2}" stroke-linecap="round"/>
        <circle cx="${rulerStart.x}" cy="${rulerStart.y}" r="${sw*2}" fill="var(--gold)"/><circle cx="${end.x}" cy="${end.y}" r="${sw*2}" fill="var(--gold)"/>`;
      measure.hidden = false;
      measure.textContent = `${Math.round(n)} square${Math.round(n)>1?'s':''} · ${Math.round(n)*5} ft`;
      const r = root.getBoundingClientRect();
      measure.style.left = (e.clientX - r.left + 14) + 'px'; measure.style.top = (e.clientY - r.top + 14) + 'px';
      return;
    }
    if(dragging){
      if(Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) > 4) dragging.moved = true;
      const w = toWorld(e.clientX, e.clientY);
      const x = w.x - dragging.dx, y = w.y - dragging.dy;
      dragging.el.style.left = x + 'px'; dragging.el.style.top = y + 'px';
      const now = performance.now();
      if(now - lastLive > 90){ lastLive = now; opts.onLive && opts.onLive(dragging.id, x, y); }
      return;
    }
    if(pan){
      if(Math.hypot(e.clientX - pan.x, e.clientY - pan.y) > 4) pan.moved = true;
      view.x = pan.vx + (e.clientX - pan.x); view.y = pan.vy + (e.clientY - pan.y); apply();
    }
  });
  function endPointer(e){
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(pinch){ if(pts.size < 2) pinch = null; return; }
    if(rulerStart){ rulerStart = null; ruler.innerHTML = ''; measure.hidden = true; return; }
    if(dragging){
      const d = dragging; dragging = null; d.el.classList.remove('drag');
      const t = C().jetons.find(j => j.id === d.id);
      if(t){
        if(d.moved){
          const c = C(), w = toWorld(e.clientX, e.clientY);

        } else if(editable){ select(t.id); }

    view.y = (cy - r.top)  - ((cy - r.top)  - view.y) * k;
    view.s = s; apply();
  }

/* Enregistre une image (carte ou jeton) : Supabase si en ligne, sinon intégrée au navigateur */
async function storeImage(f){
  if(!sb){ return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }); }
  toast('Uploading ' + f.name + '…');
  const path = Date.now() + '-' + f.name.normalize('NFD').replace(/[^\w.-]+/g,'_');
  const { error } = await sb.storage.from('scenes').upload(path, f, {contentType: f.type, upsert:false});
  if(error){ toast('Upload failed: ' + error.message); return null; }
  return sb.storage.from('scenes').getPublicUrl(path).data.publicUrl;
}

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return Object.assign(structuredClone(DEFAULT), s); }catch(e){}
  return structuredClone(DEFAULT);
}
let state = load();
let bc = null; try{ bc = new BroadcastChannel('table-mj'); }catch(e){}

/* ---- Synchronisation : Supabase si configuré, sinon entre onglets du même navigateur ---- */
const CFG = window.TABLE_CONFIG || {};
const sb = (CFG.supabaseUrl && CFG.supabaseKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
const PUBLIC_KEYS  = ['carte','images','current','ambiance','skin','discord','joueurs']; // visibles par les joueurs
const PRIVATE_KEYS = ['notesUrl','split','music','codeJoueurs','jetonsBiblio'];                                   // réservés au MJ
const pick = (o, keys) => Object.fromEntries(keys.map(k => [k, o[k]]));
let session = null, pushTimer = null;

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(sb){
    if(!session) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 250);   // regroupe les frappes rapides
    setSync('pending');
  } else {
    bc && bc.postMessage(state);
  }
}
async function push(){
  const now = new Date().toISOString();
  const [a, b] = await Promise.all([
    sb.from('etat').update({data: pick(state, PUBLIC_KEYS), updated_at: now}).eq('id','public'),
    sb.from('etat').update({data: pick(state, PRIVATE_KEYS), updated_at: now}).eq('id','prive')
  ]);
  if(a.error || b.error){ setSync('error'); toast('Synchronisation impossible : ' + (a.error||b.error).message); }
  else setSync('ok');
  broadcast();
}
/* Diffusion en direct aux joueurs, sur un canal dont le nom dépend du code joueurs */
let liveCh = null, liveCode = null, liveReady = false;
function ensureLive(){
  const code = state.codeJoueurs || '';
  if(code === liveCode) return;
  if(liveCh) sb.removeChannel(liveCh);

let feedTimer = null, feedSig = '', feedBusy = false;
function feedTag(text, cls){ const t = $('#feedTag'); if(t){ t.textContent = text; t.className = 'tag ' + (cls || ''); } }
function feedEmpty(title, text){

function renderFeed(){

    pollFeed();

async function pollFeed(){
  if(feedBusy) return; feedBusy = true;
  try{
    const headers = {};
    let url = '/api/discord';
    if(isAdmin){
      const ses = (await sb.auth.getSession()).data.session;
      if(ses) headers.Authorization = 'Bearer ' + ses.access_token;
    } else url += '?code=' + encodeURIComponent(playerCode);
    const r = await fetch(url, {headers});
    if(r.status === 404 && !(r.headers.get('content-type') || '').includes('json')){
      feedTag('Not set up', ''); feedEmpty('Discord bot not set up yet', isAdmin ? 'Add the bot file to the site to show your channel here.' : 'Your GM is still setting this up.'); return;
    }
    const data = await r.json().catch(() => ({}));
    if(data.error){
      feedTag(data.error === 'rate_limited' ? 'Live · slowing down' : 'Not connected', data.error === 'rate_limited' ? '' : 'err');
      if(data.error !== 'rate_limited') feedEmpty('Discord unavailable', isAdmin ? data.message : 'Your GM needs to check the Discord settings.');
      return;
    }
    if(!data.channel && !(data.messages || []).length && !(state.discord && state.discord.channel)){
      feedTag('No channel', ''); feedEmpty('No channel chosen', isAdmin ? 'Paste a channel link in ⚙ Settings.' : 'Your GM hasn\'t picked a channel yet.'); return;
    }
    feedTag('Live', 'ok');
    if(data.channel && !(state.discord && state.discord.label)) $('#chanTitle').textContent = '#' + data.channel;
    const sig = JSON.stringify(data.messages);
    if(sig === feedSig) return;
    feedSig = sig;
    const f = $('#feed'), atBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 60;
    f.innerHTML = data.messages.length ? data.messages.map(renderMsg).join('') : '<div class="empty"><div><b>No messages yet</b>Messages posted in the channel will appear here.</div></div>';
    if(atBottom || !f.dataset.init){ f.scrollTop = f.scrollHeight; f.dataset.init = '1'; }
  }catch(e){
    feedTag('Offline', 'err');
  }finally{ feedBusy = false; }
}
/* Mise en forme Discord (gras, italique, code, mentions, émojis, liens) */
function md(text, mentions){
  if(!text) return '';
  const keep = [];
  let t = esc(text);
  t = t.replace(/```(?:\w+\n)?([\s\S]*?)```/g, (_, c) => { keep.push(`<pre>${c.replace(/^\n|\n$/g,'')}</pre>`); return `\u0000${keep.length-1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, (_, c) => { keep.push(`<code>${c}</code>`); return `\u0000${keep.length-1}\u0000`; });
  t = t.replace(/&lt;@!?(\d+)&gt;/g, (_, id) => { const u = (mentions || []).find(m => m.id === id); return `<span class="ment">@${esc(u ? u.name : 'someone')}</span>`; });
  t = t.replace(/&lt;(a?):(\w+):(\d+)&gt;/g, (_, an, n, id) => `<img class="emo" alt=":${n}:" src="https://cdn.discordapp.com/emojis/${id}.${an ? 'gif' : 'png'}?size=32">`);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<b><i>$1</i></b>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>')
       .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<i>$2</i>').replace(/(^|\W)_(?!\s)(.+?)_(?=\W|$)/g, '$1<i>$2</i>').replace(/~~(.+?)~~/g, '<s>$1</s>');
  t = t.replace(/^#{1,3} (.+)$/gm, '<b>$1</b>').replace(/^&gt; (.*)$/gm, '<span class="quote">$1</span>');
  t = t.replace(/\n/g, '<br>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}
function renderMsg(m){
  const when = new Date(m.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const embeds = (m.embeds || []).map(e => `
    <div class="embed" style="${e.color ? 'border-left-color:' + esc(e.color) : ''}">
      ${e.thumbnail ? `<img class="e-th" src="${esc(e.thumbnail)}" alt="">` : ''}
      ${e.author ? `<div class="e-au">${esc(e.author)}</div>` : ''}
      ${e.title ? `<div class="t">${md(e.title, m.mentions)}</div>` : ''}
      ${e.description ? `<div class="e-de">${md(e.description, m.mentions)}</div>` : ''}
      ${e.fields.length ? `<div class="f">${e.fields.map(f => `<div class="${f.inline ? '' : 'full'}"><span class="k">${md(f.name, m.mentions)}</span>${md(f.value, m.mentions)}</div>`).join('')}</div>` : ''}
      ${e.image ? `<img class="e-im" src="${esc(e.image)}" alt="">` : ''}
      ${e.footer ? `<div class="e-fo">${esc(e.footer)}</div>` : ''}
    </div>`).join('');
  return `<div class="msg"><img class="av" src="${esc(m.avatar)}" alt="" onerror="this.style.visibility='hidden'"><div style="min-width:0">
    <div class="who">${esc(m.author)}${m.bot ? '<span class="bot">BOT</span>' : ''}<span class="when">${when}</span></div>
    ${m.content ? `<div class="txt">${md(m.content, m.mentions)}</div>` : ''}
    ${(m.images || []).map(u => `<img class="e-im" src="${esc(u)}" alt="">`).join('')}
    ${embeds}
  </div></div>`;
}

async function uploadImage(f){
  const name = f.name.replace(/\.[^.]+$/,'');
  if(!sb){ const r=new FileReader(); r.onload=()=>addImage(name, r.result); r.readAsDataURL(f); return; }
  toast('Uploading ' + name + '…');
  const path = Date.now() + '-' + f.name.normalize('NFD').replace(/[^\w.-]+/g,'_');
  const { error } = await sb.storage.from('scenes').upload(path, f, {contentType: f.type, upsert:false});
  if(error) return toast('Upload failed: ' + error.message);
  const { data } = sb.storage.from('scenes').getPublicUrl(path);
  addImage(name, data.publicUrl, path);
}
/* Notes en lecture seule : Google Doc ou fichier du Drive (.txt, .pdf…) affiché en mode aperçu, sans menus */
function driveReader(url){
  let m = url.match(/docs\.google\.com\/document\/d\/([\w-]+)/);
  if(m) return `https://docs.google.com/document/d/${m[1]}/preview`;
  m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || url.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
  if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return url;
}

      <button id="mNext" aria-label="Next">⏭</button>
    </div>
    <div class="now" style="width:210px"><div class="t">${esc(tr[0])}</div><div class="a">${esc(pl.name)} · ${esc(tr[1])}</div></div>
    <div style="display:flex;gap:10px;align-items:center;min-width:0">
      <select id="mPl" aria-label="Playlist">${PLAYLISTS.map((p,i)=>`<option value="${i}" ${i===m.playlist?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <div class="tracks">${pl.tracks.map((t,i)=>`<button data-t="${i}" class="${i===m.track?'on':''}">${esc(t[0])}</button>`).join('')}</div>
    </div>
    <div class="vol"><span class="tag ex">Sample · Spotify not connected</span><span>Vol.</span><input type="range" id="mVol" min="0" max="100" value="${m.volume}" aria-label="Volume"></div>`;
  const set = (patch) => { Object.assign(state.music, patch); save(); renderMusic(); };
  $('#mPlay').onclick = () => set({playing:!m.playing});
  $('#mPrev').onclick = () => set({track:(m.track-1+pl.tracks.length)%pl.tracks.length, playing:true});
  $('#mNext').onclick = () => set({track:(m.track+1)%pl.tracks.length, playing:true});
  $('#mPl').onchange = e => set({playlist:+e.target.value, track:0});
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => set({track:+b.dataset.t, playing:true}));
  $('#mVol').oninput = e => { state.music.volume = +e.target.value; save(); };
}

/* ============ Rendu ============ */
function renderChannel(){
  const d = state.discord || {};
  $('#chanTitle').textContent = d.label ? '#' + d.label : 'Discord';
}
function applySkin(){ document.documentElement.dataset.skin = state.skin || 'nuit'; }
function renderShared(){ applySkin(); renderBanner(); renderScene(); renderChannel(); }
document.title = isAdmin ? 'GM Table · Admin' : 'GM Table';
function renderAll(){ renderShared(); renderLeft(); renderFeed(); if(isAdmin){ renderMusic(); setSync(sb ? 'ok' : 'local'); } }

async function boot(){
  if(!sb){ renderAll(); return; }                       // mode local
  if(isAdmin){
    session = (await sb.auth.getSession()).data.session;
    if(!session){ showLogin(); return; }
    const { data, error } = await sb.from('etat').select('id,data');
    if(error){ toast('Could not load: ' + error.message); renderAll(); setSync('error'); return; }
    const pub = data.find(r=>r.id==='public')?.data || {}, prv = data.find(r=>r.id==='prive')?.data || {};
    const firstRun = !Object.keys(pub).length;
    state = Object.assign(structuredClone(DEFAULT), firstRun ? {} : pub, prv);
    for(const k in DEFAULT) if(state[k] == null) state[k] = structuredClone(DEFAULT[k]);   // champs manquants ou vides
    renderAll();
    ensureLive();                                         // écoute les déplacements des joueurs
    // publie l'état de départ, ou les nouveautés d'une mise à jour du site (ex. liste des joueurs)
    if(firstRun || PUBLIC_KEYS.some(k => !(k in pub))) push();
  } else {
    try{ localStorage.removeItem('table-mj-code'); }catch(e){}   // ancienne version : code mémorisé durablement
    let code = ''; try{ code = sessionStorage.getItem('table-mj-code') || ''; }catch(e){}
    if(!code){ askCode(); return; }
    const data = await readTable(code);
    if(!data){ try{ sessionStorage.removeItem('table-mj-code'); }catch(e){} askCode(true); return; }
    playerCode = code;
    try{ me = sessionStorage.getItem('table-mj-joueur') || ''; }catch(e){}
    if(!me){ chooseIdentity(data); return; }
    state = structuredClone(DEFAULT); state.images = []; state.current = null;
    Object.assign(state, data);
    for(const k in DEFAULT) if(state[k] == null) state[k] = structuredClone(DEFAULT[k]);
    renderAll();
    playerCh = sb.channel('table-' + code, {config:{broadcast:{self:false}}})
      .on('broadcast', {event:'etat'}, msg => receive(msg.payload))
      .on('broadcast', {event:'jeton'}, msg => applyJeton(msg.payload))
      .on('broadcast', {event:'joueur'}, msg => applyJoueur(msg.payload))
      .subscribe();
    // Premier passage : proposer d'importer son image de jeton
    const mine = myPlayer();
    let asked = false; try{ asked = sessionStorage.getItem('table-mj-jeton-propose') === '1'; }catch(e){}
    if(mine && !mine.img && !asked){ try{ sessionStorage.setItem('table-mj-jeton-propose','1'); }catch(e){} openMyToken(true); }
    // Contrôle régulier : rattrape un message manqué, et ferme la vue si le MJ change le code
    setInterval(async () => {
      const d = await readTable(code);
      if(d) receive(d); else { try{ sessionStorage.removeItem('table-mj-code'); }catch(e){} location.reload(); }
    }, 30000);
  }
}
async function readTable(code){
  const { data, error } = await sb.rpc('lire_table', { code });
  return error ? null : data;
}
function myPlayer(){ return me && me !== '-' ? rosterOf(me) : null; }
/* Réduit une image en vignette carrée (≈10 Ko) pour le jeton du joueur */
function tokenThumb(file){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const S = 160, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
      cv.getContext('2d').drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
      let url = cv.toDataURL('image/webp', 0.82);
      if(!url.startsWith('data:image/webp')) url = cv.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(im.src); res(url);
    };
    im.onerror = () => rej(new Error('Unreadable image'));
    im.src = URL.createObjectURL(file);
  });
}
function openMyToken(first){
  const r = myPlayer(); if(!r) return;
  const m = $('#modal');
  const face = () => r.img ? `<img src="${esc(r.img)}" alt="">` : `<span>${esc(initials(r.nom))}</span>`;
  m.hidden = false;
  m.innerHTML = `<div class="modal-card" role="dialog" aria-labelledby="mtT">
    <h2 id="mtT">${first ? 'Your token' : 'My token'}</h2>
    <p>${first ? 'Pick a color or upload a picture for ' + esc(r.nom) + '. You can change it later with “My token”.' : 'Change how ' + esc(r.nom) + ' looks on the map.'}</p>
    <div class="lib-prev"><span class="lib-c big" id="mtPrev" style="--tc:${esc(r.couleur)}">${face()}</span></div>
    <div class="swatches" role="group" aria-label="Token color">${PLAYER_COLORS.map(c => `<button class="sw ${c===r.couleur?'on':''}" data-c="${c}" style="--c:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
    <label class="btn primary" for="mtFile">Upload a picture</label><input id="mtFile" type="file" accept="image/*" hidden>
    <button class="btn" id="mtNoImg" ${r.img ? '' : 'hidden'}>Use my initial instead</button>
    <button class="btn" id="mtClose">${first ? 'Done' : 'Close'}</button>
  </div>`;
  const refresh = () => {
    const p = $('#mtPrev'); p.style.setProperty('--tc', r.couleur); p.innerHTML = face();
    $('#mtNoImg').hidden = !r.img;
    m.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === r.couleur));
  };
  async function commit(patch){
    const prev = {couleur:r.couleur, img:r.img};
    Object.assign(r, patch); refresh(); currentMap && currentMap.refresh();
    if(sb){
      const { data, error } = await sb.rpc('mon_jeton', {code:playerCode, joueur:me, couleur:r.couleur, img: patch.img === undefined ? null : patch.img});
      if(error || data === false){ Object.assign(r, prev); refresh(); currentMap && currentMap.refresh(); toast('Not saved. Try again or ask your GM.'); return; }
    } else save();
    playerCh && playerCh.send({type:'broadcast', event:'joueur', payload:Object.assign({nom:r.nom, couleur:r.couleur}, patch.img === undefined ? {} : {img:r.img})});
    toast('Token updated');
  }
  m.querySelectorAll('.sw').forEach(b => b.onclick = () => commit({couleur:b.dataset.c}));
  $('#mtNoImg').onclick = () => commit({img:''});
  $('#mtClose').onclick = () => { m.hidden = true; };
  m.onclick = e => { if(e.target === m) m.hidden = true; };   // clic à côté : fermer
  $('#mtFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ commit({img: await tokenThumb(f)}); }
    catch(err){ toast('Unreadable image: try a JPG or PNG file.'); }
  };
}
/* Un joueur a changé sa couleur ou son image */
function applyJoueur(p){
  const r = rosterOf(p.nom); if(!r) return;
  if(p.couleur) r.couleur = p.couleur;
  if(p.img !== undefined) r.img = p.img;
  currentMap && currentMap.refresh();
}
function chooseIdentity(data){
  const pjs = (data.joueurs || []);
  $('#login').hidden = false; $('#app').style.visibility = 'hidden';
  $('#loginForm').innerHTML = `
    <h1>Who are you?</h1>
    <p>Pick your character so you can move their token on the map.</p>
    <div class="who-list">${pjs.map(t => `<button type="button" class="btn who" data-n="${esc(t.nom)}"><span class="dot" style="background:${esc(t.couleur)}"></span>${esc(t.nom)}</button>`).join('')}
      ${pjs.length ? '' : '<p class="bm-hint">Your GM hasn\'t added any player characters yet.</p>'}
      <button type="button" class="btn who" data-n="-">Just watch</button></div>`;
  $('#loginForm').querySelectorAll('.who').forEach(b => b.onclick = () => {
    try{ sessionStorage.setItem('table-mj-joueur', b.dataset.n); }catch(e){}
    location.reload();
  });
}
function askCode(wrong){
  $('#login').hidden = false; $('#app').style.visibility = 'hidden';
  $('#loginForm').innerHTML = `
    <h1>GM Table</h1>
    <p>Enter the code your Game Master gave you.</p>
    <label for="cdIn">Access code</label><input id="cdIn" autocomplete="off" required autofocus>
    <button class="btn primary" type="submit">Join the table</button>
    <p class="login-err" id="lgErr" ${wrong?'':'hidden'}>Wrong or expired code.</p>`;
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const code = $('#cdIn').value.trim();
    if(!(await readTable(code))){ const er=$('#lgErr'); er.textContent='Wrong code.'; er.hidden=false; return; }
    try{ sessionStorage.setItem('table-mj-code', code); }catch(e){}
    location.reload();
  };
}
function showLogin(){
  $('#login').hidden = false; $('#app').style.visibility = 'hidden';
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPass').value });
    if(error){ const er=$('#lgErr'); er.textContent = 'Sign-in failed: check your email and password.'; er.hidden=false; return; }
    location.reload();
  };
}
boot();
</script>
